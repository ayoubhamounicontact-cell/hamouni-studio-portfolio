<!DOCTYPE html>
  <html lang="fr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMOUNI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
      body{
        font-family:'Cormorant Garamond', serif;
    background:#000;
    color:#fff;
        overflow:hidden;
}
  a{color:inherit; text-decoration:none;}

  .hero{
        position:relative; height:100vh; width:100vw;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
}
  .hero video{
        position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
  }
  .hero iframe{
        position:absolute; top:50%; left:50%; width:177.78vh; height:100vh;
    min-width:100%; min-height:56.6vw; transform:translate(-50%,-50%);
    border:0; pointer-events:none;
  }

  .content{
        position:relative; z-index:2;
    text-align:center;
}
  h1{
        font-size:clamp(2.2rem, 6vw, 4.2rem);
    font-weight:400;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-shadow:0 2px 24px rgba(0,0,0,0.4);
}
  .tagline{
        margin-top:14px;
    font-size:clamp(0.95rem, 1.6vw, 1.2rem);
    letter-spacing:0.32em;
    text-transform:uppercase;
    font-weight:300;
    color:#f2ede1;
    }
  .discover{
        display:inline-block;
    margin-top:44px;
    padding:14px 34px;
    border:1px solid rgba(255,255,255,0.75);
    font-size:0.85rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    transition:background .3s, color .3s;
}
  .discover:hover{background:#fff; color:#000;}
    </style>
    </head>
    <body>

    <section class="hero">
      <video autoplay muted loop playsinline id="heroVideo">
        <source src="https://www.youtube.com/watch?v=7dZautbFooY" type="video/mp4">
      </video>
      <iframe src="https://www.youtube.com/embed/7dZautbFooY?autoplay=1&mute=1&loop=1&playlist=7dZautbFooY&controls=0&showinfo=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3&vq=hd1080"
        allow="autoplay; encrypted-media" title="HAMOUNI Studio"></iframe>

      <div class="content">
        <h1>Hamouni Studio</h1>
        <div class="tagline">Photographie &amp; Vidéo</div>
    <a class="discover" href="travaux.html">Découvrir</a>
      </div>
    </section>

    <script>
      document.getElementById('heroVideo').style.display = 'none';
</script>
  </body>
  </html>
