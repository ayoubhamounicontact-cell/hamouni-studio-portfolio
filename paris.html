<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris | HAMOUNI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
    body{background:#000; color:#fff; font-family:'Work Sans', sans-serif; font-weight:300;}
      a{color:inherit; text-decoration:none;}
        img{display:block; width:100%;}
          h1,h2{font-family:'Cormorant Garamond', serif; font-weight:400;}

            nav{
                position:fixed; top:0; left:0; right:0; z-index:50;
                    display:flex; justify-content:space-between; align-items:center;
                        padding:28px 5vw; mix-blend-mode:difference;
                          }
                            .brand{font-family:'Cormorant Garamond', serif; font-size:1.2rem; letter-spacing:0.14em; text-transform:uppercase;}
                              .back{font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase; opacity:0.85;}

                                .p-hero{position:relative; height:100vh; min-height:600px; overflow:hidden;}
                                  .p-hero img{width:100%; height:100%; object-fit:cover;}
                                    .p-hero::after{content:''; position:absolute; inset:0;
                                        background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.85) 100%);}
                                          .p-hero-content{position:absolute; left:5vw; bottom:6vw; z-index:2;}
                                            .p-hero .eyebrow{font-size:0.75rem; letter-spacing:0.28em; text-transform:uppercase; color:#c9a97b; margin-bottom:14px; display:block;}
                                              .p-hero h1{font-size:clamp(2.6rem, 7vw, 5.5rem); letter-spacing:0.03em;}

                                                .video-section{padding:9vw 5vw 4vw;}
                                                  .video-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#111;}
                                                    .video-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

                                                      .gallery{
                                                          display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; padding:6vw 5vw 8vw;
                                                            }
                                                              .gallery figure{overflow:hidden; background:#000;}
                                                                .gallery img{width:100%; height:100%; object-fit:cover; transition:transform .9s cubic-bezier(.2,.7,.2,1);}
                                                                  .gallery figure:hover img{transform:scale(1.04);}
                                                                    .g-a{grid-column:span 4; grid-row:span 2;}
                                                                      .g-b{grid-column:span 2; grid-row:span 1;}
                                                                        .g-c{grid-column:span 2; grid-row:span 1;}
                                                                          .g-d{grid-column:span 3; grid-row:span 2;}
                                                                            .g-e{grid-column:span 3; grid-row:span 2;}
                                                                              .g-f{grid-column:span 2; grid-row:span 1;}
                                                                                .g-g{grid-column:span 4; grid-row:span 1;}
                                                                                  .g-h{grid-column:span 3; grid-row:span 2;}
                                                                                    .g-i{grid-column:span 3; grid-row:span 2;}
                                                                                      .g-j{grid-column:span 2; grid-row:span 1;}
                                                                                        .g-k{grid-column:span 4; grid-row:span 1;}

                                                                                          footer{
                                                                                              padding:8vw 5vw 5vw; border-top:1px solid rgba(255,255,255,0.15);
                                                                                                  display:flex; flex-wrap:wrap; justify-content:space-between; gap:40px;
                                                                                                    }
                                                                                                      footer .fbrand{font-size:clamp(2rem,5vw,3.2rem); font-family:'Cormorant Garamond'; font-weight:400;}
                                                                                                        footer .fmeta{font-size:0.85rem; opacity:0.65; line-height:2; text-align:right;}
                                                                                                        
                                                                                                          @media (max-width: 760px){
                                                                                                              .gallery{grid-template-columns:repeat(2,1fr);}
                                                                                                                  .g-a,.g-d,.g-e,.g-g,.g-h,.g-i,.g-k{grid-column:span 2;}
                                                                                                                      .g-b,.g-c,.g-f,.g-j{grid-column:span 1;}
                                                                                                                          footer{flex-direction:column;} footer .fmeta{text-align:left;}
                                                                                                                            }
                                                                                                                            </style>
                                                                                                                            </head>
                                                                                                                            <body>
                                                                                                                            
                                                                                                                            <nav>

                                                                                                                                <a class="back" href="travaux.html">← Retour</a>
                                                                                                                                </nav>

                                                                                                                                    <div class="p-hero-content">
                                                                                                                                        <span class="eyebrow">Film &amp; Photographie</span>
                                                                                                                                            <h1>Paris</h1>
                                                                                                                                              </div>
                                                                                                                                              </section>

                                                                                                                                                <div class="video-wrap">
                                                                                                                                                    <iframe src="https://drive.google.com/file/d/1yQtSJaKRxCg_Y9Pk2Klr-mb5g32KsRMu/preview" allow="autoplay" allowfullscreen title="Paris — vue aérienne"></iframe>
                                                                                                                                                      </div>
                                                                                                                                                      </section>
                                                                                                                                                      
                                                                                                                                                      <div class="gallery">
                                                                                                                                                        <figure class="g-a"><img src="https://lh3.googleusercontent.com/d/1-n-HSCztYOaftsGMbL-InWMVe91l-JDh=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                          <figure class="g-b"><img src="https://lh3.googleusercontent.com/d/1kRUXB2oHXrYsCJQ9D1Hgnn2EaARqlpPH=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                            <figure class="g-c"><img src="https://lh3.googleusercontent.com/d/1mWEX-Anv0qI8O6-Y7zAeaXAuT2gBw5Qm=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                              <figure class="g-d"><img src="https://lh3.googleusercontent.com/d/1jBR98uoQy5MoTiTMLX3xKOcW-fji1pyN=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                <figure class="g-e"><img src="https://lh3.googleusercontent.com/d/1jAD0IEO7RDbA_YRQOnmYIVMciHNEarLO=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                  <figure class="g-f"><img src="https://lh3.googleusercontent.com/d/1I9UCi-NkTlwgSzZJvrHV6Qb47c4e7Pg2=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                    <figure class="g-g"><img src="https://lh3.googleusercontent.com/d/1x5PVcTyNLxZ42fPjZZsfUuBJLpqVlHpP=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                      <figure class="g-h"><img src="https://lh3.googleusercontent.com/d/1oqP1U45zAsykjkwj6Z0F9pI9sW0_N83i=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                        <figure class="g-i"><img src="https://lh3.googleusercontent.com/d/1j_n2Rof3QKOhz7mMsYls4ZzPl3gWeEbo=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                          <figure class="g-j"><img src="https://lh3.googleusercontent.com/d/1JpBjvYN_JuQORR9JEK227Pw1kTi8RFYD=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                            <figure class="g-k"><img src="https://lh3.googleusercontent.com/d/1rPkSlhQx7sxZjycQUX6QPEer4kpaXKqO=w1600" loading="lazy" alt="Paris"></figure>
                                                                                                                                                                            </div>
                                                                                                                                                                            
                                                                                                                                                                            <footer>
                                                                                                                                                                              <div class="fbrand">Un projet<br>similaire en tête ?</div>
                                                                                                                                                                                <div class="fmeta">
                                                                                                                                                                                    HAMOUNI Studio — Paris<br>
