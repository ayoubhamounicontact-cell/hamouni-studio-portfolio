<!DOCTYPE html>
  <html lang="fr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travaux — HAMOUNI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
  body{
        background:#000; color:#fff;
      font-family:'Work Sans', sans-serif;
}
  a{color:inherit; text-decoration:none;}
  img{display:block; width:100%; height:100%; object-fit:cover;}

  nav{
        display:flex; justify-content:space-between; align-items:center;
    padding:32px 5vw;
}
  .brand{font-family:'Cormorant Garamond', serif; font-size:1.3rem; letter-spacing:0.14em; text-transform:uppercase;}
  .nav-links{display:flex; gap:34px; font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase;}
  .nav-links a{opacity:0.7; transition:opacity .3s;}
  .nav-links a:hover, .nav-links a.active{opacity:1;}

  .grid{
        display:grid; grid-template-columns:repeat(3, 1fr);
    gap:2px; padding:0 0 2px;
  }
  .card{
        position:relative; aspect-ratio:4/5; overflow:hidden; background:#111;
  }
  .card img{transition:transform 1s cubic-bezier(.2,.7,.2,1); filter:brightness(0.7);}
  .card:hover img{transform:scale(1.05); filter:brightness(0.8);}
  .card .label{
    position:absolute; left:24px; bottom:24px; z-index:2;
    font-family:'Cormorant Garamond', serif;
    font-size:1.5rem;
    letter-spacing:0.04em;
  }
  .card .tag{
    position:absolute; left:24px; top:24px; z-index:2;
    font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase; opacity:0.75;
  }

  @media (max-width:800px){
    .grid{grid-template-columns:1fr;}
    .nav-links{display:none;}
}
</style>
  </head>
  <body>

  <nav>
    <a class="brand" href="index.html">Hamouni Studio</a>
    <div class="nav-links">
      <a class="active" href="travaux.html">Travaux</a>
      <a href="ayoub.html">À propos</a>
      <a href="https://www.instagram.com/hamouni.ay" target="_blank">Instagram</a>
    </div>
  </nav>

  <div class="grid">
    <a class="card" href="chef-wii.html">
      <span class="tag">Gastronomie</span>
      <img src="https://lh3.googleusercontent.com/d/1pEiud8iDQo99k4szbTFxRU-VAdkKBDX9=w1200" alt="Chef Wii">
      <span class="label">Chef Wii</span>
    </a>
    <a class="card" href="paris.html">
      <span class="tag">Film</span>
      <img src="https://lh3.googleusercontent.com/d/1GHwzq1k1uaGg38uvsn2dpbd8fanc4kaC=w1200" alt="Paris">
      <span class="label">Paris</span>
    </a>
    <a class="card" href="gala.html">
      <span class="tag">Événementiel</span>
    <img src="https://lh3.googleusercontent.com/d/1lRvAFIvorgju8fQPY4aZd0o09etEkOO3=w1200" alt="Gala des Chefs du Cœur">
      <span class="label">Gala des Chefs du Cœur</span>
    </a>
  </div>

  </body>
  </html>
