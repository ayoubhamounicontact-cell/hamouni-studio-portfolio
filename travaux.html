<!DOCTYPE html>
  <html lang="fr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travaux — HAMOUNI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#000; color:#fff; font-family:'Work Sans', sans-serif;}
    a{color:inherit; text-decoration:none;}
  img{display:block; width:100%; height:100%; object-fit:cover;}
  nav{display:flex; justify-content:space-between; align-items:center; padding:28px 5vw; position:relative; z-index:100;}
  .brand{font-family:'Cormorant Garamond', serif; font-size:1.3rem; letter-spacing:0.14em; text-transform:uppercase;}
  .nav-links{display:flex; gap:28px; font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase;}
  .nav-links a{opacity:0.7;}
  .nav-links a:hover, .nav-links a.active{opacity:1;}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none; padding:6px;}
  .burger span{width:24px; height:1px; background:#fff; display:block;}
    .mobile-panel{display:none; position:fixed; inset:0; background:#000; z-index:90; flex-direction:column; align-items:center; justify-content:center; gap:32px;}
  .mobile-panel.open{display:flex;}
  .mobile-panel a{font-family:'Cormorant Garamond', serif; font-size:1.6rem;}
  .grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; padding:0 0 2px;}
  .card{position:relative; aspect-ratio:4/5; overflow:hidden; background:#111; display:block;}
  .card img{transition:transform .5s ease;}
  .card:hover img{transform:scale(1.02);}
  @media (max-width:800px){
    .grid{grid-template-columns:1fr;}
    .nav-links{display:none;}
    .burger{display:flex;}
      }
</style>
      </head>
      <body>
      <nav>
        <a class="brand" href="index.html">Hamouni Studio</a>
        <div class="nav-links">
          <a class="active" href="travaux.html">Travaux</a>
          <a href="ayoub.html">À propos</a>
          <a href="clients.html">Clients</a>
          <a href="devis.html">Estimer un projet</a>
    <a href="contact.html">Contact</a>
    <a href="https://www.instagram.com/hamouni.ay" target="_blank">Instagram</a>
  </div>
  <button class="burger" id="burgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
      </nav>
      <div class="mobile-panel" id="mobilePanel">
        <a href="travaux.html">Travaux</a>
        <a href="ayoub.html">À propos</a>
        <a href="clients.html">Clients</a>
        <a href="devis.html">Estimer un projet</a>
  <a href="contact.html">Contact</a>
  <a href="https://www.instagram.com/hamouni.ay" target="_blank">Instagram</a>
</div>
<div class="grid">
  <a class="card" href="chef-wii.html">
          <img src="https://lh3.googleusercontent.com/d/1TnJ_58gRwoIcEXV03HtigjitrUnfStTZ=w1600" alt="Chef Wii">
        </a>
        <a class="card" href="paris.html">
          <img src="https://lh3.googleusercontent.com/d/1EILCNxKfeHd7Uelal6Ukt9MqHqfYoJYR=w1600" alt="Paris">
        </a>
        <a class="card" href="mariage.html">
          <img src="https://drive.google.com/thumbnail?id=15KDScjqrOYTj9UkAmJrrZE68MSPeHl6O&sz=w1600" alt="Mariage">
        </a>
        <a class="card" href="gala-paris.html">
          <img src="https://lh3.googleusercontent.com/d/1lRvAFIvorgju8fQPY4aZd0o09etEkOO3=w1600" alt="Gala des Chefs du Cœur — Paris">
        </a>
        <a class="card" href="gala-rabat.html">
          <img src="https://lh3.googleusercontent.com/d/1ISSAqmq7v-fB1HRe66m6tnZPVFj-ROo_=w1600" alt="Gala des Chefs du Cœur — Rabat">
        </a>
      </div>
      <script>
        const burger = document.getElementById('burgerBtn');
  const panel = document.getElementById('mobilePanel');
  burger.addEventListener('click', () => panel.classList.toggle('open'));
  panel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => panel.classList.remove('open')));
</script>
  </body>
  </html>
